<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>quillkey</title>
<meta name="description" content="quillkey: a minimal, distraction-free text and code editor with a smooth caret, themes, and a built-in Python/C++ runner.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316365a'/%3E%3Crect x='8' y='9' width='12' height='3' rx='1.5' fill='%236fdc9d'/%3E%3Crect x='8' y='15' width='8' height='3' rx='1.5' fill='%236fdc9d'/%3E%3Crect x='22' y='8' width='3' height='16' rx='1.5' fill='%236fdc9d'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#16365a;--main:#6fdc9d;--caret:#6fdc9d;--sub:#356b8c;--alt:#12304f;--text:#e3f3ea;--fs:36px;--cw:20px;--ch:40px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--sub);font-family:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;transition:background .25s}
body{min-height:100vh;display:flex;flex-direction:column;padding:28px 48px}
.ui{transition:opacity .25s}
body.typing .ui{opacity:0;pointer-events:none}
body.typing{cursor:none}
header{display:flex;align-items:center;gap:22px;height:56px}
.logo{display:flex;align-items:center;gap:10px;color:var(--text);font-family:"Lexend Deca",sans-serif;font-size:36px;font-weight:600;letter-spacing:-1px;position:relative;line-height:1}
.logo small{position:absolute;left:46px;top:-12px;font-size:11px;font-weight:400;color:var(--sub);letter-spacing:0}
.logo svg{color:var(--main)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:color .15s}
button:hover{color:var(--text)}
.ic{width:22px;height:22px;display:grid;place-items:center}
.sp{flex:1}
#status{font-size:13px}
#bar{display:flex;justify-content:center;gap:18px;margin:26px 0 0;flex-wrap:wrap}
.grp{display:flex;background:var(--alt);border-radius:9px;padding:0 8px;height:54px;align-items:center;gap:4px;font-size:15px}
.grp button{padding:8px 14px}
.grp button.on{color:var(--main)}
#info{text-align:center;color:var(--main);font-size:15px;height:24px;margin:70px 0 14px;transition:opacity .2s}
#wrap{position:relative;width:min(1180px,100%);margin:0 auto;font-size:var(--fs);line-height:1.55;flex:1 0 auto;cursor:text}
#ta,#mir,#hl{display:block;width:100%;margin:0;padding:0;border:0;font:inherit;line-height:inherit;letter-spacing:0;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4}
#ta{position:relative;background:transparent;color:var(--text);caret-color:transparent;outline:none;resize:none;overflow:hidden;min-height:46vh}
#ta::placeholder{color:var(--sub);opacity:1}
#ta::selection{background:var(--main);color:var(--bg)}
#mir{position:absolute;top:0;left:0;visibility:hidden;pointer-events:none}
#hl{position:absolute;top:0;left:0;pointer-events:none;color:var(--text);display:none}
body.code #hl{display:block}body.code #ta{color:transparent}
body.code #ta::selection{background:color-mix(in srgb,var(--main) 40%,transparent);color:transparent}
#hl .k{color:var(--main)}#hl .s{color:var(--str)}#hl .c{color:var(--sub);font-style:italic}#hl .n{color:var(--num)}#hl .f{color:var(--fn)}#hl .t{color:var(--ty)}#hl .p{color:var(--pp)}#hl .b{color:var(--ty)}#hl .d{color:var(--pp)}
#caret{position:absolute;left:0;top:0;width:3px;height:var(--ch);background:var(--caret);border-radius:2px;pointer-events:none;will-change:transform;z-index:2}
#caret.smooth{transition:transform .085s ease-out,width .1s,height .1s}
#caret.block{width:var(--cw);opacity:.55;border-radius:2px}
#caret.underline{width:var(--cw);height:4px;margin-top:calc(var(--ch) - 4px)}
#caret.outline{width:var(--cw);background:transparent;border:2px solid var(--caret)}
#caret.idle{animation:bl 1s steps(1) infinite}
#caret.hide{display:none}
@keyframes bl{0%,100%{opacity:1}50%{opacity:0}}
.hints{text-align:center;font-size:13px;line-height:2.1;margin:28px 0 22px}
kbd{font:inherit;font-size:11px;background:var(--sub);color:var(--bg);border-radius:4px;padding:2px 6px;margin-right:4px}
footer{display:flex;gap:22px;font-size:14px;align-items:center;flex-wrap:wrap}
footer button{display:flex;gap:7px;align-items:center}
#pal{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;justify-content:center;align-items:flex-start;padding-top:14vh;z-index:10}
#pal.open{display:flex}
#pb{width:min(600px,92vw);background:var(--bg);border-radius:10px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#pq{width:100%;background:var(--alt);border:0;outline:0;color:var(--text);font:inherit;font-size:16px;padding:18px 22px}
#pl{max-height:48vh;overflow:auto}
#pl div{padding:10px 22px;font-size:14px;cursor:pointer}
#pl div.sel{background:var(--text);color:var(--bg)}
@media(max-width:700px){body{padding:16px 18px}header{gap:8px}#status{display:none}.grp{max-width:100%;flex-wrap:wrap;height:auto;min-height:48px;justify-content:center}#wrap{font-size:min(var(--fs),22px)}.logo{font-size:26px}#info{margin-top:36px}}
#run{position:fixed;left:0;right:0;bottom:0;height:36vh;background:var(--alt);border-top:2px solid var(--sub);display:none;flex-direction:column;z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
#run.open{display:flex}
body.runopen{padding-bottom:42vh}
.rh{display:flex;align-items:center;gap:6px;padding:6px 48px;font-size:14px}
.rh button{padding:6px 12px;border-radius:6px}.rh button:hover{background:var(--bg)}
#rRun{color:var(--main)}
.rh .lbl{color:var(--main)}
#rb{flex:1;display:flex;gap:18px;min-height:0;padding:0 48px 14px}
#out{flex:1;margin:0;overflow:auto;font:14px/1.5 "Roboto Mono",ui-monospace,monospace;color:var(--text);white-space:pre-wrap;word-break:break-word;user-select:text}
#rRun.stop{color:#ff6b6b}#out .u{color:var(--main)}#out .e{color:#ff6b6b}.ti{background:none;border:0;border-bottom:1px solid var(--main);color:var(--main);font:inherit;outline:0;padding:0;min-width:2ch}#out .m{color:var(--sub)}
#stdin{width:min(280px,30%);background:var(--bg);border:0;border-radius:8px;outline:0;resize:none;color:var(--text);font:14px/1.5 "Roboto Mono",ui-monospace,monospace;padding:10px}
#stdin::placeholder{color:var(--sub)}
@media(max-width:700px){.rh,#rb{padding-left:16px;padding-right:16px}#rb{flex-direction:column}#stdin{width:100%;height:60px;flex:none}}
#hl .h{color:var(--main)}
body:not(.md) [data-t="preview"],body:not(.md) [data-t="live"]{display:none}
#pv{display:none;width:min(820px,100%);margin:0 auto;flex:1 0 auto;color:var(--text);font:18px/1.7 "Lexend Deca",system-ui,sans-serif;overflow-wrap:break-word}
#pv h1,#pv h2,#pv h3,#pv h4,#pv h5,#pv h6{color:var(--main);line-height:1.25;margin:1.2em 0 .5em}
#pv h1{font-size:2em}#pv h2{font-size:1.5em}#pv h3{font-size:1.2em}
#pv code{font-family:"Roboto Mono",ui-monospace,monospace;background:var(--alt);padding:.1em .35em;border-radius:4px;font-size:.88em}
#pv pre{background:var(--alt);padding:14px 16px;border-radius:8px;overflow:auto}#pv pre code{background:none;padding:0}
#pv blockquote{margin:1em 0;padding-left:16px;border-left:3px solid var(--sub);color:var(--sub)}#pv blockquote p{margin:.3em 0}
#pv a{color:var(--main)}#pv hr{border:0;border-top:2px solid var(--sub);margin:1.5em 0}
#pv ul,#pv ol{padding-left:1.4em}#pv li{margin:.2em 0}#pv input{margin-right:.5em}
#drop{position:fixed;inset:12px;border:3px dashed var(--main);border-radius:16px;background:color-mix(in srgb,var(--bg) 88%,transparent);color:var(--main);display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-size:24px;z-index:20;pointer-events:none}#drop small{font-size:14px;color:var(--sub)}body.drag #drop{display:flex}
body.live #ta{position:absolute!important;left:0;top:0;width:100%;height:1px!important;min-height:0!important;opacity:0;overflow:hidden;pointer-events:none}
body.live #hl{display:none}
#lv{display:none;position:relative;min-height:46vh;font-family:"Lexend Deca",system-ui,sans-serif;font-size:calc(var(--fs)*.62);line-height:1.7;color:var(--text);cursor:text;user-select:none;-webkit-user-select:none}
body.live #lv{display:block}
#lv .ln{padding:.1em 0;min-height:1.7em;white-space:pre-wrap;overflow-wrap:break-word}
#lv .ln.empty:only-child::before{content:'start typing…';color:var(--sub)}
#lv .ln:not(.act) .mk{display:none}
#lv .ln.act .mk{color:var(--sub);font-size:.8em}
#lv .h1,#lv .h2,#lv .h3,#lv .h4,#lv .h5,#lv .h6{font-weight:600;color:var(--main);line-height:1.3}
#lv .h1{font-size:1.9em;padding-top:.35em}#lv .h2{font-size:1.55em;padding-top:.3em}#lv .h3{font-size:1.3em}#lv .h4{font-size:1.15em}#lv .h5,#lv .h6{font-size:1em}
#lv .quote{border-left:3px solid var(--sub);padding-left:14px;color:color-mix(in srgb,var(--text) 65%,var(--sub))}
#lv .li{position:relative;padding-left:calc(1.5em + var(--ind,0em))}
#lv .ul:not(.act)::before{content:'•';position:absolute;left:calc(.4em + var(--ind,0em));color:var(--main)}
#lv .tk:not(.act)::before{content:'☐';position:absolute;left:calc(.2em + var(--ind,0em));color:var(--main)}
#lv .tk.done:not(.act)::before{content:'☑'}
#lv .num{color:var(--main)}
#lv .done .tx{text-decoration:line-through;color:var(--sub)}
#lv .code{font-family:"Roboto Mono",ui-monospace,monospace;font-size:.85em;background:var(--alt);padding:.1em 14px;line-height:1.6}
#lv .fence{color:var(--sub)}
#lv .hr:not(.act)::after{content:'';display:block;border-top:2px solid var(--sub);margin:.7em 0}
#lv strong{font-weight:600}#lv em{font-style:italic}#lv del{text-decoration:line-through}
#lv .ic2{font-family:"Roboto Mono",ui-monospace,monospace;font-size:.88em;background:var(--alt);padding:.1em .3em;border-radius:4px}
#lv .lk{color:var(--main);text-decoration:underline}
::highlight(qsel){background-color:color-mix(in srgb,var(--main) 38%,transparent)}
</style>
</head>
<body>
<header class="ui">
  <div class="logo"><svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><rect x="2" y="2" width="30" height="30" rx="8"/><path d="M10 12h9M10 21h6M24 10v14"/></svg>quillkey<small>type freely</small></div>
  <button class="ic" id="bCmd" title="command line (esc)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 15h10"/></svg></button>
  <button class="ic" id="bDl" title="download .txt"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 20h16"/></svg></button>
  <button class="ic" id="bSet" title="settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></button>
  <button class="ic" id="bRun" title="run code (ctrl+enter)"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg></button>
  <div class="sp"></div><div id="status">saved locally</div>
</header>
<div id="bar" class="ui">
  <div class="grp" id="gl"><button data-l="text">text</button><button data-l="python">python</button><button data-l="cpp">c++</button><button data-l="md">markdown</button></div>
  <div class="grp" id="g1"><button data-t="stats">stats</button><button data-t="focus">focus</button><button data-t="smooth">smooth caret</button><button data-t="live">live</button><button data-t="preview">preview</button></div>
  <div class="grp" id="g2"><button data-c="line">line</button><button data-c="block">block</button><button data-c="underline">underline</button><button data-c="outline">outline</button></div>
  <div class="grp" id="g3"><button data-s="22">22</button><button data-s="30">30</button><button data-s="36">36</button><button data-s="46">46</button></div>
</div>
<div id="info"></div>
<div id="pv"></div><div id="wrap"><div id="mir" aria-hidden="true"></div><div id="hl" aria-hidden="true"></div><div id="lv" aria-hidden="true"></div><div id="caret" class="smooth"></div><textarea id="ta" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="start typing…"></textarea></div>
<div class="hints ui"><div><kbd>esc</kbd> or <kbd>cmd + shift + p</kbd> - command line</div><div><kbd>tab</kbd> - indent &nbsp; <kbd>ctrl + /</kbd> - comment &nbsp; <kbd>ctrl + enter</kbd> - run &nbsp; <kbd>ctrl + s</kbd> - download</div></div>
<footer class="ui"><button id="fOpen">open file</button><button id="fClr">clear</button><button id="fDl">download</button><button id="fCmd">commands</button><div class="sp"></div><span id="thn"></span></footer>
<div id="run"><div class="rh"><span class="lbl">output</span><span class="sp"></span><button id="rRun">▶ run</button><button id="rClr">clear</button><button id="rX">close</button></div><div id="rb"><pre id="out"></pre><textarea id="stdin" spellcheck="false" placeholder="Program input (stdin): one line per input() / cin value. Python can also ask in the output panel."></textarea></div></div>
<div id="drop"><span>drop a file to open it</span><small>.txt · .py · .cpp · .md</small></div>
<input type="file" id="file" accept=".txt,.md,text/*" hidden>

function workerMain(){

 const MAP={PIL:'Pillow',yaml:'pyyaml',bs4:'beautifulsoup4',sklearn:'scikit-learn',cv2:'opencv-python',dateutil:'python-dateutil',skimage:'scikit-image',Crypto:'pycryptodome'};
 const ENG={
  skulpt:async m=>{
   if(!self.Sk)importScripts(CW.sk+'skulpt.min.js',CW.sk+'skulpt-stdlib.js');
   Sk.configure({output:out,read:x=>{if(!Sk.builtinFiles||!Sk.builtinFiles.files[x])throw "File not found: '"+x+"'";return Sk.builtinFiles.files[x]},__future__:Sk.python3,yieldLimit:100,inputfunTakesPrompt:true,
    inputfun:async p=>{out(p||'');const l=await nextLine();if(l===null)throw new Error('EOFError: EOF when reading a line');return l}});
   await Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody('<stdin>',false,m.code,true));
  },
  pyodide:async m=>{
   if(!PY){

    const mod=await import(CW.pyo+'pyodide.mjs');
    PY=await mod.loadPyodide({indexURL:CW.pyo});
    const dec=new TextDecoder(),w=b=>{out(dec.decode(b,{stream:true}));return b.length};
    PY.setStdout({write:w});PY.setStderr({write:w});
    PY.setStdin({stdin:()=>preset.length?preset.shift():null});
    self.__qk_line=nextLine;
    PY.runPython("import builtins, sys, warnings\nwarnings.filterwarnings('ignore', module='micropip')\nfrom js import __qk_line\nfrom pyodide.ffi import run_sync, can_run_sync\ndef _qk_input(prompt=''):\n    if prompt: sys.stdout.write(str(prompt)); sys.stdout.flush()\n    if not can_run_sync(): raise RuntimeError('input() needs a recent Chrome/Edge (JSPI). Use the preset input box instead.')\n    r = run_sync(__qk_line())\n    if r is None: raise EOFError('EOF when reading a line')\n    return r\nbuiltins.input = _qk_input\n");
    status('');
   }
   const CB={messageCallback:s=>status(s),errorCallback:s=>out('[pip] '+s+'\n')};
   await PY.loadPackagesFromImports(m.code,CB);
   PY.globals.set('__qk_code',m.code);
   const miss=PY.runPython("import importlib.util\nfrom pyodide.code import find_imports\n[x for x in find_imports(__qk_code) if importlib.util.find_spec(x) is None]").toJs();
   if(miss.length){
    status('installing from PyPI…');
    try{
     await PY.loadPackage('micropip',{messageCallback:()=>{},errorCallback:()=>{}});const mp=PY.pyimport('micropip');
     for(const n of miss){const pk=MAP[n]||n;out('[pip] installing '+pk+'…\n');
      try{await mp.install(pk)}catch(e){out('[pip] could not install '+pk+': '+String(e.message||e).split('\n').filter(Boolean).pop()+'\n')}}
    }catch(e){out('[pip] package installer unavailable: '+String(e.message||e).split('\n').filter(Boolean).pop()+'\n')}
    status('');
   }
   const g=PY.globals.get('dict')();g.set('__name__','__main__');
   try{await PY.runPythonAsync(m.code,{globals:g})}
   catch(e){const L=String(e.message||e).split('\n'),i=L.findIndex(l=>l.includes('File "<exec>"'));throw new Error(i>0?[L[0]].concat(L.slice(i)).join('\n'):L.join('\n'))}
   finally{try{g.destroy()}catch(_){}}
  },
  jscpp:async m=>{
   if(!self.JSCPP){if(CW.jscppUrl)importScripts(CW.jscppUrl);else importScripts(URL.createObjectURL(new Blob([CW.jscppText],{type:'text/javascript'})))}

 };

function show(t,c){
 if(shownN>2e6)return;shownN+=t.length;
 if(shownN>2e6){t='\n… output truncated (2 MB limit)\n';c='m'}
 c=c||'';
 if(last&&last.c===c){last.n.appendData(t)}
 else{const s=document.createElement('span');if(c)s.className=c;const n=document.createTextNode(t);s.append(n);outp.append(s);last={c,n}}
 outp.scrollTop=outp.scrollHeight;
}
const status=s=>{rhl.textContent=s?'output · '+s:'output'};
function openRun(){run$.classList.add('open');document.body.classList.add('runopen')}
function closeRun(){if(running)stopRun();run$.classList.remove('open');document.body.classList.remove('runopen');ta.focus()}
function askLine(){return new Promise((res,rej)=>{
 const i=document.createElement('input');i.className='ti';i.spellcheck=false;i.autocomplete='off';i.size=2;outp.append(i);last=null;i.focus();outp.scrollTop=outp.scrollHeight;

  if(e.key==='Enter'){e.preventDefault();e.stopPropagation();const v=i.value;i.remove();askCancel=null;show(v+'\n','u');res(v)}
  else if(e.key==='d'&&e.ctrlKey){e.preventDefault();e.stopPropagation();i.remove();askCancel=null;show('^D\n','m');res(null)}
 };

})}
outp.addEventListener('click',()=>{const i=outp.querySelector('.ti');if(i)i.focus()});
function getWorker(kind){
 if(workers[kind])return workers[kind];
 return workers[kind]=new Worker(URL.createObjectURL(new Blob(['('+workerMain.toString()+')()'],{type:'text/javascript'})),{type:kind==='py'?'module':'classic'});
}
async function runIn(kind,engine,code,preset){
 if(engine==='jscpp'&&CFG.gz&&!CFG.jscppText)CFG.jscppText=await ungz(CFG.gz);
 const cfg={sk:CFG.sk,pyo:CFG.pyo,jscppUrl:CFG.jscppUrl,jscppText:workers[kind]?'':CFG.jscppText};
 return new Promise((res,rej)=>{
  const w=getWorker(kind);cur={w,kind,rej};
  w.onmessage=e=>{const m=e.data;
   if(m.t==='o')show(m.s);
   else if(m.t==='s')status(m.s);
   else if(m.t==='ask')askLine().then(v=>{if(cur&&cur.w===w)w.postMessage({t:'input',v})}).catch(()=>{});
   else if(m.t==='done')res(m);
   else if(m.t==='err')rej(new Error(m.m))};
  w.onerror=e=>rej(new Error(e.message||'worker failed to start'));

}
function stopRun(){
 if(cur&&cur.w){cur.w.terminate();delete workers[cur.kind];cur.rej(new Error('Stopped'))}
 if(cur&&cur.abort)cur.abort.abort();
 if(askCancel)askCancel();
}
const netErr=m=>Object.assign(new Error(m),{net:true});
const ver=s=>(String(s).match(/\d+/g)||[]).map(Number);
const cmpV=(a,b)=>{a=ver(a);b=ver(b);for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0};
async function cppOnline(src,preset,ab,st){
 const J={Accept:'application/json'};
 try{
  if(!gcc){
   status('connecting to the online compiler…');
   const r=await fetch('https://godbolt.org/api/compilers/c++?fields=id,name,semver',{headers:J,signal:ab.signal});
   if(!r.ok)throw netErr('HTTP '+r.status);
   const l=(await r.json()).filter(c=>/^x86-64 gcc \d/.test(c.name)).sort((a,b)=>cmpV(b.name,a.name));
   if(!l.length)throw netErr('no g++ found');gcc=l[0].id;
  }
  let sin=preset.length?preset.join('\n')+'\n':'';
  if(!sin&&/\b(cin|scanf|getline|gets|getchar|fgets|fscanf)\b/.test(src.replace(/\/\*[\s\S]*?\*\/|\/\/.*|"(?:\\.|[^"\\\n])*"/g,'')))throw Object.assign(new Error('needs input'),{needIn:true});
  status('compiling and running…');
  const r=await fetch('https://godbolt.org/api/compiler/'+gcc+'/compile',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},J),signal:ab.signal,
   body:JSON.stringify({source:src,lang:'c++',allowStoreCodeDebug:false,options:{userArguments:'-O1 -std=c++20',executeParameters:{args:[],stdin:sin},compilerOptions:{executorRequest:true},filters:{execute:true}}})});
  if(!r.ok)throw netErr('HTTP '+r.status);
  const j=await r.json(),tx=a=>(a||[]).map(x=>x.text).join('\n');
  const br=j.buildResult||(j.execResult&&j.execResult.buildResult),ex=j.execResult||j;
  if(br&&br.code!==0&&br.code!==undefined){show(tx(br.stdout)+(br.stdout&&br.stdout.length?'\n':'')+tx(br.stderr)+'\n','e');return {code:br.code,build:true}}
  if(ex.stdout&&ex.stdout.length)show(tx(ex.stdout)+'\n');
  if(ex.stderr&&ex.stderr.length)show(tx(ex.stderr)+'\n','e');
  return {code:ex.code!==undefined?ex.code:j.code};
 }catch(e){if(e.name==='AbortError')throw new Error('Stopped');if(e.net||e.needIn||e.message==='Stopped')throw e;throw netErr(e.message||'network error')}
}
const setBtn=on=>{const b=$('#rRun');b.textContent=on?'■ stop':'▶ run';b.classList.toggle('stop',on);$('#bRun').title=on?'stop':'run code (ctrl+enter)'};
async function runCode(){
 if(running){stopRun();return}
 openRun();outp.textContent='';last=null;shownN=0;
 if(S.lang==='text'||S.lang==='md'){show('Choose python or c++ in the language bar to run code.','m');return}
 running=true;setBtn(true);const t0=performance.now(),src=ta.value;let fin='',quick=false,wantIn=false;
 const preset=stdin.value.trim()?stdin.value.replace(/\n$/,'').split('\n'):[];
 try{
  if(S.lang==='python'){
   const mode=S.py||'auto';
   if(mode==='full')await runIn('py','pyodide',src,preset);
   else{
    try{await runIn('sk','skulpt',src,preset)}
    catch(e){
     if(mode==='auto'&&/No module named|ImportError|NotImplementedError|not (yet )?implemented/i.test(e.message)){
      outp.textContent='';last=null;shownN=0;show('This program needs something the quick engine lacks; switching to full Python…\n','m');
      await runIn('py','pyodide',src,preset);
     }else throw e}
   }
  }else{
   const mode=S.cpp||'auto';let info=null;
   if(mode==='quick'){quick=true;info=await runIn('cpp','jscpp',src,preset)}
   else{
    const ab=new AbortController(),st={lines:[]};cur={abort:ab};
    try{info=await cppOnline(src,preset,ab,st)}
    catch(e){
     if(mode==='auto'&&e.net){show('Online compiler unreachable ('+e.message+'). Using the built-in quick interpreter (C-style C++ only).\n\n','m');quick=true;info=await runIn('cpp','jscpp',src,preset.concat(st.lines))}
     else throw e}
   }
   if(info&&typeof info.code==='number')fin=', exit code '+info.code;
  }
  show('\n[finished in '+Math.round(performance.now()-t0)+' ms'+fin+']\n','m');
 }catch(e){
  let m=String(e.message||e).replace(/^Error: /,'');
  if(e.needIn){show('This program reads input. Type it in the input box on the right (one line per Enter), then run again with ▶ or Ctrl+Enter.\n','m');wantIn=true}
  else if(m==='Stopped'||m.endsWith(': Stopped'))show((outp.textContent&&!outp.textContent.endsWith('\n')?'\n':'')+'[stopped]\n','m');
  else{
   show((outp.textContent&&!outp.textContent.endsWith('\n')?'\n':'')+m+'\n','e');
   if(S.lang==='cpp'&&quick&&/not defined|cannot find library|Parsing Failure/.test(m))show('\nNote: the quick C++ interpreter supports C-style C++ only (iostream with cin/cout, cstdio printf, cmath, cstring, cstdlib). Classes, structs, references, std::string, vector and range-based for loops are not supported. Use the full online compiler for those.\n','m');
